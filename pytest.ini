[pytest]
testpaths = tests
addopts =
    --strict-markers
    -ra
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
    --output=test-results
    --html=reports/report.html
    --self-contained-html
markers =
    tc(id): links a test to a TC-nnn scenario in /specs (used by scripts/traceability.py)
    api: API-level tests
    e2e: browser end-to-end tests (Playwright)
    data: seed data quality tests
    no_server: test does not need the running application
